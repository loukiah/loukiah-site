# Pages CMS: the editor for loukiah.com (app.pagescms.org)
# Everything you can change without code is defined here.

media:
  input: src/media
  output: /media

content:
  - name: films
    label: Films
    type: collection
    path: src/films
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    exclude: [films.11tydata.json]
    view:
      primary: title
      fields: [title, type, category, order, published]
      sort: [order]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: Web address, type: string, required: true, description: "Lowercase with dashes, e.g. half-an-orange. The page will be loukiah.com/films/half-an-orange" }
      - { name: type, label: Type, type: string, description: "Shown next to the title, e.g. short film, music video, commercial" }
      - name: category
        label: Category (for the filter)
        type: select
        options: { values: [narrative, commercial] }
      - { name: order, label: Order on the Films page, type: number, description: "1 comes first" }
      - { name: published, label: Show on the site, type: boolean, default: true }
      - { name: loop, label: Thumbnail clip (short mp4, no sound), type: file }
      - { name: poster, label: Thumbnail still, type: image }
      - { name: video, label: Vimeo link, type: string, description: "For private videos use Vimeo’s Share link, with the part after the number" }
      - name: parts
        label: Several videos (e.g. trailer + making of)
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: video, label: Vimeo link, type: string }
      - { name: about, label: About the film, type: text }
      - name: credits
        label: Credits
        type: object
        list: true
        fields:
          - { name: role, label: Role, type: string }
          - { name: name, label: Name, type: string }
      - name: laurels
        label: Laurels
        type: object
        list: true
        fields:
          - { name: text, label: Festival and award (for search engines), type: string }
          - { name: image, label: Laurel image, type: image }

  - name: portraits
    label: Portraits page
    type: file
    path: src/_data/portraits.json
    format: json
    fields:
      - { name: heading, label: Heading, type: string }
      - { name: intro, label: Intro, type: text }
      - { name: german, label: German line, type: text }
      - { name: form_note, label: Text above the form, type: text }
      - { name: photos, label: Photos, type: image, list: true }

  - name: aboutpage
    label: About page
    type: file
    path: src/_data/aboutpage.json
    format: json
    fields:
      - { name: paragraphs, label: "Paragraphs (use <br> for a line break)", type: text, list: true }

  - name: clients
    label: Clients
    type: file
    path: src/_data/clients.json
    format: json
    fields:
      - { name: clients, label: Clients, type: string, list: true }

  - name: site
    label: Contact & settings
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: email, label: Email, type: string }
      - { name: instagram, label: Instagram link, type: string }
      - { name: vimeo, label: Vimeo link, type: string }
      - { name: linkedin, label: LinkedIn link, type: string }
      - { name: formspree, label: Formspree form address, type: string, description: "e.g. https://formspree.io/f/abcdwxyz" }
      - { name: description, label: Description for Google, type: text }
      - name: address
        label: Address (Impressum)
        type: object
        fields:
          - { name: street, label: Street, type: string }
          - { name: zip, label: Postcode, type: string }
          - { name: city, label: City, type: string }
          - { name: country, label: Country, type: string }
